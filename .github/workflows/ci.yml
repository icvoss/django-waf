name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          # Django 6.0 and 6.1 require Python 3.12+
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # django-celery-beat caps at Django<6.1 (2.9.0 declares
      # "Django<6.1,>=2.2"). Installing the celery extra alongside Django 6.1
      # silently DOWNGRADES Django to 6.0.x and exits 0, so both nominal 6.1
      # legs executed 6.0 for their entire life while pyproject.toml
      # advertised Framework :: Django :: 6.1 on PyPI (issue #98).
      #
      # Only django-celery-beat carries that cap: celery itself is
      # Django-agnostic and installs cleanly on 6.1. So the 6.1 leg keeps
      # full celery coverage (src/django_waf/tasks.py imports `shared_task`
      # from celery at module scope, and 81 tests import that module) and
      # drops ONLY the beat scheduler. Do not "simplify" this to
      # ".[dev]" on 6.1: that removes celery, tasks.py then raises
      # ModuleNotFoundError at import, and 81 tests fail for a reason that
      # has nothing to do with Django 6.1.
      - name: Install dependencies
        run: |
          pip install "Django~=${{ matrix.django-version }}.0"
          if [ "${{ matrix.django-version }}" = "6.1" ]; then
            pip install -e ".[dev]" "celery>=5.3"
          else
            pip install -e ".[dev,celery]"
          fi

      - name: Assert the installed Django is the version this leg claims
        run: |
          want="${{ matrix.django-version }}"
          got="$(python -c 'import django; print(".".join(map(str, django.VERSION[:2])))')"
          echo "requested Django ${want}, resolved ${got}"
          if [ "${got}" != "${want}" ]; then
            echo "::error::Django ${want} was requested but ${got} is installed."
            echo "::error::A dependency has silently downgraded Django (see issue #98)."
            exit 1
          fi

      - name: Lint
        run: ruff check src/ tests/

      - name: Test with coverage
        run: pytest --cov=src --cov-report=term-missing

  # Dedicated leg, not part of the matrix above: the defect this leg exists
  # to catch (getdel requiring Redis 6.2+, silently failing on 6.0.16 for
  # 40,936 task runs, never caught because the package has never executed
  # a single Redis command against a real server) is Redis-version-specific,
  # not Python/Django-version-specific. Real-Redis behaviour does not vary
  # across the python-version x django-version matrix, so running it on all
  # 7 legs would multiply CI time sevenfold for no extra defect-catching
  # power. One dedicated leg on a single, representative Python/Django pair
  # guarantees every PR exercises real Redis exactly once.
  #
  # Pinned to Redis 6.0 (the package's lowest supported version per its
  # documented floor, see checks.py / redis_client.py), not latest: testing
  # against Redis 7 would have hidden the getdel defect exactly as fakeredis
  # did, since GETDEL exists from 6.2 onwards and both fakeredis (regardless
  # of its version= argument, which does not gate GETDEL) and Redis 6.2+
  # accept it silently. Only a real server below 6.2 raises.
  test-redis-integration:
    name: Test (real Redis 6.0 integration)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install "Django~=6.1.0"
          pip install -e ".[dev,celery]"

      - name: Test against real Redis 6.0
        run: pytest tests/ -v --tb=short --color=yes --ds=tests.settings_redis -m redis_integration
        env:
          DJANGO_WAF_TEST_REDIS_URL: redis://localhost:6379/0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.22"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/
