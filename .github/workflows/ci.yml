name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          # Django 6.0 and 6.1 require Python 3.12+
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # django-celery-beat caps at Django<6.1 (2.9.0 declares
      # "Django<6.1,>=2.2"). Installing the celery extra alongside Django 6.1
      # silently DOWNGRADES Django to 6.0.x and exits 0, so both nominal 6.1
      # legs executed 6.0 for their entire life while pyproject.toml
      # advertised Framework :: Django :: 6.1 on PyPI (issue #98).
      #
      # Only django-celery-beat carries that cap: celery itself is
      # Django-agnostic and installs cleanly on 6.1. So the 6.1 leg keeps
      # full celery coverage (src/django_waf/tasks.py imports `shared_task`
      # from celery at module scope, and 81 tests import that module) and
      # drops ONLY the beat scheduler. Do not "simplify" this to
      # ".[dev]" on 6.1: that removes celery, tasks.py then raises
      # ModuleNotFoundError at import, and 81 tests fail for a reason that
      # has nothing to do with Django 6.1.
      - name: Install dependencies
        run: |
          pip install "Django~=${{ matrix.django-version }}.0"
          if [ "${{ matrix.django-version }}" = "6.1" ]; then
            pip install -e ".[dev]" "celery>=5.3"
          else
            pip install -e ".[dev,celery]"
          fi

      - name: Assert the installed Django is the version this leg claims
        run: |
          want="${{ matrix.django-version }}"
          got="$(python -c 'import django; print(".".join(map(str, django.VERSION[:2])))')"
          echo "requested Django ${want}, resolved ${got}"
          if [ "${got}" != "${want}" ]; then
            echo "::error::Django ${want} was requested but ${got} is installed."
            echo "::error::A dependency has silently downgraded Django (see issue #98)."
            exit 1
          fi

      - name: Lint
        run: ruff check src/ tests/

      - name: Test with coverage
        run: pytest --cov=src --cov-report=term-missing

  # Dedicated leg, not part of the matrix above: the defect this leg exists
  # to catch (getdel requiring Redis 6.2+, silently failing on 6.0.16 for
  # 40,936 task runs, never caught because the package has never executed
  # a single Redis command against a real server) is Redis-version-specific,
  # not Python/Django-version-specific. Real-Redis behaviour does not vary
  # across the python-version x django-version matrix, so running it on all
  # 7 legs would multiply CI time sevenfold for no extra defect-catching
  # power. One dedicated leg on a single, representative Python/Django pair
  # guarantees every PR exercises real Redis exactly once.
  #
  # Pinned to Redis 6.0 (the package's lowest supported version per its
  # documented floor, see checks.py / redis_client.py), not latest: testing
  # against Redis 7 would have hidden the getdel defect exactly as fakeredis
  # did, since GETDEL exists from 6.2 onwards and both fakeredis (regardless
  # of its version= argument, which does not gate GETDEL) and Redis 6.2+
  # accept it silently. Only a real server below 6.2 raises.
  test-redis-integration:
    name: Test (real Redis 6.0 integration)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:6.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Same trap as the matrix legs (#98): django-celery-beat caps at
      # Django<6.1, so installing the celery extra after Django 6.1 silently
      # downgrades it to 6.0.x at exit 0. Verified on a green main run of
      # this very job, which logged "Successfully installed Django-6.1"
      # followed by "Successfully installed Django-6.0.8". Only beat carries
      # the cap; celery itself installs cleanly on 6.1, and tasks.py imports
      # shared_task at module scope, so celery must stay.
      - name: Install dependencies
        run: |
          pip install "Django~=6.1.0"
          pip install -e ".[dev]" "celery>=5.3"

      - name: Assert the installed Django is the version this leg claims
        run: |
          got="$(python -c 'import django; print(".".join(map(str, django.VERSION[:2])))')"
          echo "requested Django 6.1, resolved ${got}"
          if [ "${got}" != "6.1" ]; then
            echo "::error::Django 6.1 was requested but ${got} is installed."
            echo "::error::A dependency has silently downgraded Django (see issue #98)."
            exit 1
          fi

      - name: Test against real Redis 6.0
        run: pytest tests/ -v --tb=short --color=yes --ds=tests.settings_redis -m redis_integration
        env:
          DJANGO_WAF_TEST_REDIS_URL: redis://localhost:6379/0

  # Dedicated leg, not part of the matrix above. The matrix runs entirely on
  # sqlite in-memory, which is materially more permissive than the PostgreSQL
  # consumers actually deploy on: it does not validate GenericIPAddressField
  # values on write, and it differs on constraint and transaction behaviour.
  # That gap is not theoretical. Two tests in test_services.py passed on
  # sqlite for their whole life by inserting '999.999.999.999' into
  # RequestLog.ip_address to exercise a ValueError guard; PostgreSQL's inet
  # type rejects that at insert, so the precondition, and the guard it was
  # proving, are unreachable there via that column. Any bulk_create or
  # field-validation claim was unverifiable against a real deployment before
  # this leg existed (issue #72).
  #
  # One leg, not a matrix dimension: backend divergence is a property of the
  # backend, not of the Python/Django pair, so multiplying it across the
  # matrix would multiply CI time for no extra defect-catching power. Same
  # reasoning as the Redis leg above.
  test-postgres:
    name: Test (real PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_waf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e ".[dev,celery]" "psycopg[binary]>=3.1"

      - name: Test against real PostgreSQL
        run: pytest tests/ -q --color=yes
        env:
          DJANGO_WAF_TEST_DB: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: django_waf_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.15.22"
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  # Dedicated leg. mypy is configured in pyproject.toml with the django-stubs
  # plugin and documented in the README as the project's type gate, but until
  # issue #111 no workflow ran it, so a type regression could reach main with
  # every check green. The declared bar and the enforced bar had diverged.
  #
  # PYTHONPATH=. is load-bearing, not decoration. [tool.django-stubs] sets
  # django_settings_module = "tests.settings", a dotted path resolved from the
  # repo root. Without the repo root on the path the plugin cannot import the
  # settings module, and mypy exits 2 having checked NOTHING. That failure is
  # easy to misread as a pass when a run is scripted, so this leg asserts the
  # file count below rather than trusting the exit status alone.
  #
  # mypy and django-stubs are pinned exactly, like ruff in the lint leg above:
  # a type checker that floats will fail a branch that has not changed, on
  # somebody else's release, in a job nobody touched.
  typecheck:
    name: Type check (mypy + django-stubs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The api, celery and geoip extras are installed so the optional-import
      # modules (django_waf.api.*, tasks.py, the GeoIP service) are actually
      # analysed. Without them mypy skips those files as unresolvable imports
      # and the gate silently covers less than it appears to.
      - name: Install dependencies
        run: pip install -e ".[dev,celery,api,geoip]" "mypy==2.3.1" "django-stubs==6.1.0"

      # Guard against the exit-2-checked-nothing failure described above: a
      # real run analyses the whole src/ tree. If this count collapses, the
      # gate has stopped checking rather than started passing.
      # Match on the "N source files" suffix, which BOTH summary forms end
      # with: "Success: no issues found in 86 source files" on a clean run,
      # and "Found 3 errors in 2 files (checked 86 source files)" otherwise.
      # An earlier version of this guard keyed on the word "checked", which
      # appears only in the second form, so it extracted 0 on exactly the
      # runs that passed and failed this job on its first green tree.
      - name: Assert mypy actually analysed the source tree
        run: |
          summary="$(PYTHONPATH=. mypy src/ 2>&1 | tail -1)"
          echo "mypy summary: ${summary}"
          count="$(printf '%s' "${summary}" | grep -oE '[0-9]+ source files?' | grep -oE '^[0-9]+' || echo 0)"
          echo "mypy analysed ${count} source files"
          if [ "${count}" -lt 80 ]; then
            echo "::error::mypy analysed only ${count} source files; expected 80+."
            echo "::error::The run is a no-op, not a pass (see issue #111: missing PYTHONPATH exits 2 having checked nothing)."
            exit 1
          fi

      - name: Type check
        run: PYTHONPATH=. mypy src/
